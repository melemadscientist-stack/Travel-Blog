<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Metro Journal</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Windows Phone 7 (Metro) Dark Theme */
        :root {
            --bg-dark: #0A0A0A;
            --tile-bg: #161616;
            --text-light: #F2F2F2;
            --text-dim: #A0A0A0;
            --accent-cyan: #00A4EF;
            --accent-magenta: #E3008C;
            --accent-orange: #FF8C00;
            --accent-lime: #7FBA00;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 3rem;
            overflow-x: hidden;
        }

        /* --- TOP NAVBAR --- */
        navbar {
            background-color: var(--bg-dark);
            padding: 1rem 1.2rem;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .pivot-container {
            display: flex;
            gap: 1.2rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .pivot-container::-webkit-scrollbar {
            display: none;
        }

        .pivot-item {
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s;
        }

        .pivot-item.active, .pivot-item:hover {
            color: var(--text-light);
            font-weight: 400;
            border-bottom: 2px solid var(--accent-cyan);
        }

        .btn-add-memory {
            background-color: var(--accent-cyan);
            color: black;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* --- MAIN 2-COLUMN LAYOUT --- */
        .app-layout {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .app-layout {
                flex-direction: row;
            }
        }

        /* PERMANENT LEFT BANNER (TREE + TIMELINE) */
        .left-banner {
            flex: 0 0 280px;
            background-color: var(--tile-bg);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            height: fit-content;
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-orange);
            margin: 1.2rem 0 0.6rem 0;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }

        .section-label:first-child {
            margin-top: 0;
        }

        /* Tree View */
        .tree-list, .tree-list ul {
            list-style: none;
            padding-left: 0.8rem;
        }

        .tree-node {
            margin: 0.4rem 0;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-dim);
        }

        .tree-node:hover {
            color: var(--accent-cyan);
        }

        .tree-node strong {
            color: var(--text-light);
        }

        /* Timeline View */
        .timeline-list {
            list-style: none;
            border-left: 2px solid var(--accent-lime);
            padding-left: 0.8rem;
            margin-left: 0.3rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .timeline-item {
            margin-bottom: 0.8rem;
            cursor: pointer;
        }

        .timeline-item .t-place {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .timeline-item .t-date {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* MAIN FEED CONTENT */
        .main-content {
            flex: 1;
            min-width: 0;
        }

        #map {
            height: 280px;
            width: 100%;
            background: var(--tile-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            z-index: 1;
        }

        .post-card {
            background-color: var(--tile-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            padding: 1.2rem;
        }

        .post-card.featured {
            border-left: 5px solid var(--accent-cyan);
        }

        .post-badge {
            display: inline-block;
            background-color: var(--accent-magenta);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .post-title {
            font-size: 1.6rem;
            font-weight: 300;
            color: var(--text-light);
        }

        .post-sub {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .ai-facts-box {
            background-color: #0F1923;
            border-left: 3px solid var(--accent-cyan);
            padding: 0.7rem 0.9rem;
            margin: 0.8rem 0;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #C0E0F0;
        }

        .hero-photo {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            margin: 0.8rem 0;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .post-story {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #D0D0D0;
        }

        .thumbnail-grid {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-top: 0.8rem;
        }

        .thumbnail-grid img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        /* --- COLLAPSIBLE RIGHT SIDE DRAWER (ADD ITEM) --- */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 2000;
        }

        .right-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 400px;
            height: 100%;
            background: #111111;
            border-left: 2px solid var(--border-color);
            z-index: 2001;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .right-drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #1A1A1A;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 0.85rem;
            outline: none;
        }

        .hidden-input {
            display: none;
            margin-top: 0.4rem;
        }

        .btn-metro {
            background-color: var(--accent-cyan);
            color: black;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-ai {
            background-color: var(--accent-magenta);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            width: 100%;
            cursor: pointer;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* --- PHOTO LIGHTBOX POPUP --- */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .lightbox-modal.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 25px;
            color: var(--text-light);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 3001;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <navbar>
        <div class="brand-title">🌍 Wanderlust</div>
        <div class="pivot-container" id="pivotBar">
            <span class="pivot-item active" onclick="filterByCountry('ALL')">ALL</span>
        </div>
        <button class="btn-add-memory" id="openDrawerBtn">+ Add Memory</button>
    </navbar>

    <!-- MAIN APP LAYOUT -->
    <div class="app-layout">
        
        <!-- PERMANENT LEFT SIDE BANNER -->
        <div class="left-banner">
            <div class="section-label">🌳 Explorer Tree</div>
            <div id="treeContainer"></div>

            <div class="section-label">⏳ Timeline View</div>
            <ul class="timeline-list" id="timelineList"></ul>
        </div>

        <!-- CENTER MAIN FEED -->
        <div class="main-content">
            <div id="map"></div>
            <div id="postsContainer"></div>
        </div>

    </div>

    <!-- COLLAPSIBLE RIGHT DRAWER (ADD MEMORY FORM) -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="right-drawer" id="rightDrawer">
        <div class="drawer-header">
            <h3>✍️ Add New Entry</h3>
            <button class="drawer-close" id="closeDrawerBtn">&times;</button>
        </div>

        <div class="form-group">
            <label>🔑 Gemini API Key</label>
            <input type="password" id="geminiApiKey" placeholder="Paste API Key here...">
        </div>

        <form id="travelForm">
            <div class="form-group">
                <label>Country *</label>
                <select id="countrySelect" required>
                    <option value="">-- Select Country --</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="Italy">Italy</option>
                    <option value="Other">Other...</option>
                </select>
                <input type="text" id="customCountry" class="hidden-input" placeholder="Type country">
            </div>

            <div class="form-group">
                <label>State / Region *</label>
                <select id="stateSelect" required disabled>
                    <option value="">-- Select Country First --</option>
                </select>
                <input type="text" id="customState" class="hidden-input" placeholder="Type state">
            </div>

            <div class="form-group">
                <label>Place / City *</label>
                <select id="placeSelect" required disabled>
                    <option value="">-- Select State First --</option>
                </select>
                <input type="text" id="customPlace" class="hidden-input" placeholder="Type place">
            </div>

            <div class="form-group">
                <label>Date Visited *</label>
                <input type="date" id="visitDate" required>
            </div>

            <div class="form-group">
                <label>Upload Photos</label>
                <input type="file" id="photoInput" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>Raw Notes / Story *</label>
                <textarea id="story" rows="3" placeholder="Write your experience..." required></textarea>
            </div>

            <button type="button" class="btn-ai" id="aiBtn">✨ Polish & Generate with AI</button>
            <button type="submit" class="btn-metro" id="submitBtn">Publish Memory</button>
        </form>
    </div>

    <!-- PHOTO LIGHTBOX POPUP -->
    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img class="lightbox-img" id="lightboxImg" alt="Full view">
    </div>

    <!-- Leaflet.js Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const locationDB = {
            "Germany": {
                "Bavaria": ["Eichstätt", "Munich", "Nuremberg"],
                "Berlin": ["Berlin City Center"]
            },
            "France": {
                "Île-de-France": ["Paris"]
            },
            "Italy": {
                "Lazio": ["Rome"]
            }
        };

        let entries = [
            {
                id: 1,
                country: "Germany",
                state: "Bavaria",
                place: "Eichstätt",
                date: "2026-09-20",
                lat: 48.8912,
                lng: 11.1839,
                countryFacts: "Germany • Lang: German • Currency: Euro (€) • Located in Central Europe.",
                placeFacts: "Eichstätt is famous for Baroque architecture, Willibaldsburg Castle, and Altmühltal Valley.",
                story: "Exploring the historic town of Eichstätt in the heart of Altmühltal Nature Park. Known for Baroque architecture and peaceful river valley views.",
                photos: [
                    "https://images.unsplash.com/photo-1599946347371-68eb71b16afc?auto=format&fit=crop&w=800&q=80"
                ]
            }
        ];

        // Leaflet Map Initialization
        const map = L.map('map').setView([48.8912, 11.1839], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let mapMarkers = [];

        // Collapsible Drawer Controls
        const rightDrawer = document.getElementById('rightDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        document.getElementById('openDrawerBtn').onclick = () => {
            rightDrawer.classList.add('open');
            drawerOverlay.style.display = 'block';
        };

        const closeDrawer = () => {
            rightDrawer.classList.remove('open');
            drawerOverlay.style.display = 'none';
        };

        document.getElementById('closeDrawerBtn').onclick = closeDrawer;
        drawerOverlay.onclick = closeDrawer;

        // Lightbox Popup Controls
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightboxModal.classList.add('open');
        }

        document.getElementById('lightboxClose').onclick = () => {
            lightboxModal.classList.remove('open');
        };

        lightboxModal.onclick = (e) => {
            if (e.target === lightboxModal) lightboxModal.classList.remove('open');
        };

        // Cascading Dropdowns
        const countrySel = document.getElementById('countrySelect');
        const stateSel = document.getElementById('stateSelect');
        const placeSel = document.getElementById('placeSelect');

        countrySel.addEventListener('change', () => {
            const country = countrySel.value;
            stateSel.innerHTML = '<option value="">-- Select State --</option>';
            placeSel.innerHTML = '<option value="">-- Select Place --</option>';
            placeSel.disabled = true;

            if (country === 'Other') {
                toggleCustom('customCountry', true);
                toggleCustom('customState', true);
                toggleCustom('customPlace', true);
                stateSel.disabled = false;
                placeSel.disabled = false;
            } else if (locationDB[country]) {
                toggleCustom('customCountry', false);
                stateSel.disabled = false;
                Object.keys(locationDB[country]).forEach(st => {
                    stateSel.innerHTML += `<option value="${st}">${st}</option>`;
                });
                stateSel.innerHTML += `<option value="Other">Other...</option>`;
            }
        });

        stateSel.addEventListener('change', () => {
            const country = countrySel.value;
            const state = stateSel.value;
            placeSel.innerHTML = '<option value="">-- Select Place --</option>';

            if (state === 'Other') {
                toggleCustom('customState', true);
                toggleCustom('customPlace', true);
                placeSel.disabled = false;
            } else if (locationDB[country] && locationDB[country][state]) {
                toggleCustom('customState', false);
                placeSel.disabled = false;
                locationDB[country][state].forEach(pl => {
                    placeSel.innerHTML += `<option value="${pl}">${pl}</option>`;
                });
                placeSel.innerHTML += `<option value="Other">Other...</option>`;
            }
        });

        placeSel.addEventListener('change', () => {
            toggleCustom('customPlace', placeSel.value === 'Other');
        });

        function toggleCustom(id, show) {
            const el = document.getElementById(id);
            el.style.display = show ? 'block' : 'none';
            el.required = show;
        }

        // Render UI
        function renderUI(filterCountry = "ALL") {
            map.closePopup(); // Clear any open popups

            entries.sort((a, b) => new Date(b.date) - new Date(a.date));

            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            // 1. Pivot Bar
            const pivotBar = document.getElementById('pivotBar');
            const uniqueCountries = [...new Set(entries.map(e => e.country))];
            
            let pivotHtml = `<span class="pivot-item ${filterCountry === 'ALL' ? 'active' : ''}" onclick="filterByCountry('ALL')">ALL</span>`;
            uniqueCountries.forEach(c => {
                const isActive = c === filterCountry ? 'active' : '';
                pivotHtml += `<span class="pivot-item ${isActive}" onclick="filterByCountry('${c}')">${c.toUpperCase()}</span>`;
            });
            pivotBar.innerHTML = pivotHtml;

            // Filter entries
            const filtered = filterCountry === "ALL" 
                ? entries 
                : entries.filter(e => e.country === filterCountry);

            // 2. Feed Posts
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            filtered.forEach((entry, idx) => {
                const marker = L.marker([entry.lat, entry.lng]).addTo(map);
                marker.bindPopup(`<b>${entry.place}</b><br>${entry.state}, ${entry.country}`);
                mapMarkers.push(marker);

                const isFeatured = idx === 0;

                let photosHtml = '';
                if (entry.photos && entry.photos.length > 0) {
                    photosHtml = `<img src="${entry.photos[0]}" class="hero-photo" onclick="openLightbox(this.src)" alt="${entry.place}">`;
                    if (entry.photos.length > 1) {
                        photosHtml += '<div class="thumbnail-grid">';
                        entry.photos.forEach(p => {
                            photosHtml += `<img src="${p}" onclick="openLightbox(this.src)" alt="Thumbnail">`;
                        });
                        photosHtml += '</div>';
                    }
                }

                const postCard = `
                    <div class="post-card ${isFeatured ? 'featured' : ''}" id="post-${entry.id}">
                        ${isFeatured ? '<span class="post-badge">✨ Most Recent</span>' : ''}
                        <div class="post-title">${entry.place}</div>
                        <div class="post-sub">${entry.state}, ${entry.country} • ${entry.date}</div>
                        
                        ${entry.countryFacts ? `<div class="ai-facts-box"><strong>🌍 Country Info:</strong> ${entry.countryFacts}</div>` : ''}
                        ${entry.placeFacts ? `<div class="ai-facts-box"><strong>📍 Place Highlights:</strong> ${entry.placeFacts}</div>` : ''}

                        ${photosHtml}
                        <p class="post-story">${entry.story}</p>
                    </div>
                `;
                container.innerHTML += postCard;
            });

            if (filtered.length > 0) {
                map.flyTo([filtered[0].lat, filtered[0].lng], 6);
            }

            renderTreeView();
            renderTimeline(filtered);
        }

        function filterByCountry(c) {
            renderUI(c);
        }

        function renderTreeView() {
            const treeContainer = document.getElementById('treeContainer');
            let treeHtml = '<ul class="tree-list">';

            const countryMap = {};
            entries.forEach(e => {
                if (!countryMap[e.country]) countryMap[e.country] = {};
                if (!countryMap[e.country][e.state]) countryMap[e.country][e.state] = [];
                countryMap[e.country][e.state].push(e);
            });

            for (let c in countryMap) {
                treeHtml += `<li class="tree-node"><strong>▸ ${c}</strong><ul>`;
                for (let s in countryMap[c]) {
                    treeHtml += `<li class="tree-node">▸ ${s}<ul>`;
                    countryMap[c][s].forEach(p => {
                        treeHtml += `<li class="tree-node" onclick="scrollToPost('post-${p.id}')">• ${p.place}</li>`;
                    });
                    treeHtml += '</ul></li>';
                }
                treeHtml += '</ul></li>';
            }
            treeHtml += '</ul>';
            treeContainer.innerHTML = treeHtml;
        }

        function renderTimeline(filtered) {
            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';
            filtered.forEach(entry => {
                timelineList.innerHTML += `
                    <li class="timeline-item" onclick="scrollToPost('post-${entry.id}')">
                        <div class="t-place"><b>${entry.place}</b>, ${entry.country}</div>
                        <div class="t-date">${entry.date}</div>
                    </li>
                `;
            });
        }

        function scrollToPost(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        // Gemini AI Handler
        document.getElementById('aiBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            const country = countrySel.value === 'Other' ? document.getElementById('customCountry').value : countrySel.value;
            const state = stateSel.value === 'Other' ? document.getElementById('customState').value : stateSel.value;
            const place = placeSel.value === 'Other' ? document.getElementById('customPlace').value : placeSel.value;
            const rawStory = document.getElementById('story').value;

            if (!apiKey) {
                alert("Please paste your Gemini API Key first!");
                return;
            }
            if (!place || !country) {
                alert("Please select Country and Place first!");
                return;
            }

            const aiBtn = document.getElementById('aiBtn');
            aiBtn.innerText = "⏳ Generating...";
            aiBtn.disabled = true;

            const prompt = `You are a travel assistant. Output JSON ONLY for: Place: ${place}, State: ${state}, Country: ${country}.
            User Notes: "${rawStory}".
            JSON Schema:
            {
                "countryFacts": "1-2 lines on currency, language, location.",
                "placeFacts": "4-5 lines on speciality and must-sees.",
                "polishedStory": "Rephrase notes into a enjoyable travel narrative."
            }`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await res.json();
                const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const jsonResult = JSON.parse(rawText);

                document.getElementById('story').value = jsonResult.polishedStory;
                window.lastAiResult = jsonResult;
                alert("✨ AI polished story & facts ready!");

            } catch (err) {
                alert("Error connecting to Gemini API.");
            } finally {
                aiBtn.innerText = "✨ Polish & Generate with AI";
                aiBtn.disabled = false;
            }
        });

        function readFiles(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }));
        }

        async function fetchCoordinates(place, state, country) {
            const query = `${place}, ${state}, ${country}`;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
            } catch (err) {}
            return { lat: 48.8912, lng: 11.1839 };
        }

        // Form Submit
        document.getElementById('travelForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Publishing...";
            btn.disabled = true;

            const finalCountry = countrySel.value === 'Other' ? document.getElementById('customCountry').value : countrySel.value;
            const finalState = stateSel.value === 'Other' ? document.getElementById('customState').value : stateSel.value;
            const finalPlace = placeSel.value === 'Other' ? document.getElementById('customPlace').value : placeSel.value;

            const photoFiles = document.getElementById('photoInput').files;
            let photoUrls = [];
            if (photoFiles.length > 0) photoUrls = await readFiles(photoFiles);

            const coords = await fetchCoordinates(finalPlace, finalState, finalCountry);

            const newEntry = {
                id: Date.now(),
                country: finalCountry,
                state: finalState,
                place: finalPlace,
                date: document.getElementById('visitDate').value,
                lat: coords.lat,
                lng: coords.lng,
                story: document.getElementById('story').value,
                countryFacts: window.lastAiResult ? window.lastAiResult.countryFacts : '',
                placeFacts: window.lastAiResult ? window.lastAiResult.placeFacts : '',
                photos: photoUrls
            };

            entries.unshift(newEntry);
            window.lastAiResult = null;

            renderUI();
            document.getElementById('travelForm').reset();
            closeDrawer();

            btn.innerText = "Publish Memory";
            btn.disabled = false;
        });

        // Initial Render
        renderUI();
    </script>
</body>
</html>
