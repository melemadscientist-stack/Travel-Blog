<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Journal</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Windows Phone 7 (Metro) Palette */
        :root {
            --bg-dark: #0A0A0A;
            --tile-bg: #161616;
            --text-light: #F2F2F2;
            --text-dim: #A0A0A0;
            --accent-cyan: #00A4EF;
            --accent-magenta: #E3008C;
            --accent-orange: #FF8C00;
            --accent-lime: #7FBA00;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 5rem;
            overflow-x: hidden;
        }

        /* --- METRO TOP PIVOT BANNER --- */
        header {
            background-color: var(--bg-dark);
            padding: 1.2rem 1.5rem;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .brand-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .btn-menu-toggle {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Metro Pivot Links */
        .pivot-container {
            display: flex;
            gap: 1.8rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            padding-bottom: 0.3rem;
        }

        .pivot-container::-webkit-scrollbar {
            display: none;
        }

        .pivot-item {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }

        .pivot-item.active, .pivot-item:hover {
            color: var(--text-light);
            font-weight: 400;
        }

        .pivot-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #1F1F1F;
            border: 1px solid #333;
            padding: 0.8rem;
            min-width: 180px;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        .pivot-item:hover .pivot-dropdown {
            display: block;
        }

        .pivot-dropdown div {
            font-size: 0.9rem;
            padding: 5px 0;
            color: var(--text-dim);
        }

        .pivot-dropdown div:hover {
            color: var(--accent-cyan);
        }

        /* --- MAIN LAYOUT --- */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        #map {
            height: 280px;
            width: 100%;
            background: var(--tile-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            z-index: 1;
        }

        /* --- METRO TILES & CARDS --- */
        .page-heading {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .post-card {
            background-color: var(--tile-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            padding: 1.5rem;
            position: relative;
        }

        .post-card.featured {
            border-left: 5px solid var(--accent-cyan);
        }

        .post-badge {
            display: inline-block;
            background-color: var(--accent-magenta);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }

        .post-title {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-light);
            margin-bottom: 0.3rem;
        }

        .post-sub {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        /* Metro AI Fact Box */
        .ai-facts-box {
            background-color: #0F1923;
            border-left: 3px solid var(--accent-cyan);
            padding: 0.8rem 1rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #C0E0F0;
        }

        .ai-facts-box strong {
            color: var(--text-light);
            display: block;
            margin-bottom: 0.2rem;
        }

        .hero-photo {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
        }

        .post-story {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #D0D0D0;
            margin-bottom: 1rem;
        }

        .thumbnail-grid {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-top: 1rem;
        }

        .thumbnail-grid img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        /* --- FULL SCREEN LEFT SIDEBAR --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            z-index: 2000;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 420px;
            height: 100%;
            background: #111111;
            border-right: 2px solid var(--border-color);
            z-index: 2001;
            transition: left 0.3s ease;
            overflow-y: auto;
            padding: 2rem 1.5rem;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-light);
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-orange);
            margin: 1.8rem 0 0.8rem 0;
            font-weight: bold;
        }

        /* Tree View Styling */
        .tree-list, .tree-list ul {
            list-style: none;
            padding-left: 1rem;
        }

        .tree-node {
            margin: 0.5rem 0;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-dim);
        }

        .tree-node:hover {
            color: var(--accent-cyan);
        }

        .tree-node strong {
            color: var(--text-light);
            font-size: 1rem;
        }

        /* Timeline Styling */
        .timeline-list {
            list-style: none;
            border-left: 2px solid var(--accent-lime);
            padding-left: 1rem;
            margin-left: 0.5rem;
        }

        .timeline-item {
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .timeline-item .t-place {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .timeline-item .t-date {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #1A1A1A;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
        }

        .hidden-input {
            display: none;
            margin-top: 0.4rem;
        }

        .btn-metro {
            background-color: var(--accent-cyan);
            color: black;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-ai {
            background-color: var(--accent-magenta);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            width: 100%;
            cursor: pointer;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- TOP METRO PIVOT BANNER -->
    <header>
        <div class="header-top">
            <div class="brand-title">🌍 Wanderlust Metro</div>
            <button class="btn-menu-toggle" id="openSidebarBtn">≡ Menu</button>
        </div>

        <div class="pivot-container" id="pivotBar">
            <span class="pivot-item active" onclick="filterByCountry('ALL')">ALL</span>
            <!-- Dynamic Country pivots will load here -->
        </div>
    </header>

    <!-- LEFT FULL-SCREEN SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Navigation</div>
            <button class="sidebar-close" id="closeSidebarBtn">&times;</button>
        </div>

        <!-- API KEY CONFIGURATION -->
        <div class="section-label">🔑 Gemini AI Setup</div>
        <div class="form-group">
            <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key here...">
        </div>

        <!-- ADD MEMORY FORM -->
        <div class="section-label">✍️ Add Travel Memory</div>
        <form id="travelForm">
            <div class="form-group">
                <label>Country *</label>
                <select id="countrySelect" required>
                    <option value="">-- Select Country --</option>
                    <option value="Germany">Germany</option>
                    <option value="France">France</option>
                    <option value="Italy">Italy</option>
                    <option value="Other">Other...</option>
                </select>
                <input type="text" id="customCountry" class="hidden-input" placeholder="Type country">
            </div>

            <div class="form-group">
                <label>State / Region *</label>
                <select id="stateSelect" required disabled>
                    <option value="">-- Select Country First --</option>
                </select>
                <input type="text" id="customState" class="hidden-input" placeholder="Type state">
            </div>

            <div class="form-group">
                <label>Place / City *</label>
                <select id="placeSelect" required disabled>
                    <option value="">-- Select State First --</option>
                </select>
                <input type="text" id="customPlace" class="hidden-input" placeholder="Type place">
            </div>

            <div class="form-group">
                <label>Date Visited *</label>
                <input type="date" id="visitDate" required>
            </div>

            <div class="form-group">
                <label>Upload Photos</label>
                <input type="file" id="photoInput" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>Raw Notes / Story *</label>
                <textarea id="story" rows="3" placeholder="Tell us what you saw or experienced..." required></textarea>
            </div>

            <button type="button" class="btn-ai" id="aiBtn">✨ Polish & Generate with AI</button>
            <button type="submit" class="btn-metro" id="submitBtn">Publish Memory</button>
        </form>

        <!-- TREE HIERARCHY MENU -->
        <div class="section-label">🌳 Explorer Tree</div>
        <div id="treeContainer"></div>

        <!-- TIMELINE VIEW -->
        <div class="section-label">⏳ Timeline View</div>
        <ul class="timeline-list" id="timelineList"></ul>
    </div>

    <!-- MAIN PAGE CONTENT -->
    <div class="main-container">
        
        <!-- Interactive Map -->
        <div id="map"></div>

        <!-- Feed Section -->
        <div class="page-heading" id="pageHeading">Travel Journal</div>
        <div id="postsContainer"></div>

    </div>

    <!-- Leaflet.js Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const locationDB = {
            "Germany": {
                "Bavaria": ["Eichstätt", "Munich", "Nuremberg"],
                "Berlin": ["Berlin City Center"]
            },
            "France": {
                "Île-de-France": ["Paris"]
            },
            "Italy": {
                "Lazio": ["Rome"]
            }
        };

        let entries = [
            {
                id: 1,
                country: "Germany",
                state: "Bavaria",
                place: "Eichstätt",
                date: "2026-09-20",
                lat: 48.8912,
                lng: 11.1839,
                countryFacts: "Germany • Lang: German • Currency: Euro (€) • Located in Central Europe.",
                placeFacts: "Eichstätt is famous for Baroque architecture, Willibaldsburg Castle, and Altmühltal Valley.",
                story: "Exploring the historic town of Eichstätt in the heart of Altmühltal Nature Park. Known for Baroque architecture and peaceful river valley views.",
                photos: [
                    "https://images.unsplash.com/photo-1599946347371-68eb71b16afc?auto=format&fit=crop&w=800&q=80"
                ]
            }
        ];

        // Leaflet Map Initialization
        const map = L.map('map').setView([48.8912, 11.1839], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let mapMarkers = [];

        // Sidebar Controls
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        
        document.getElementById('openSidebarBtn').onclick = () => {
            sidebar.classList.add('open');
            sidebarOverlay.style.display = 'block';
        };

        const closeSidebar = () => {
            sidebar.classList.remove('open');
            sidebarOverlay.style.display = 'none';
        };

        document.getElementById('closeSidebarBtn').onclick = closeSidebar;
        sidebarOverlay.onclick = closeSidebar;

        // Cascading Dropdown Logic
        const countrySel = document.getElementById('countrySelect');
        const stateSel = document.getElementById('stateSelect');
        const placeSel = document.getElementById('placeSelect');

        countrySel.addEventListener('change', () => {
            const country = countrySel.value;
            stateSel.innerHTML = '<option value="">-- Select State --</option>';
            placeSel.innerHTML = '<option value="">-- Select Place --</option>';
            placeSel.disabled = true;

            if (country === 'Other') {
                toggleCustom('customCountry', true);
                toggleCustom('customState', true);
                toggleCustom('customPlace', true);
                stateSel.disabled = false;
                placeSel.disabled = false;
            } else if (locationDB[country]) {
                toggleCustom('customCountry', false);
                stateSel.disabled = false;
                Object.keys(locationDB[country]).forEach(st => {
                    stateSel.innerHTML += `<option value="${st}">${st}</option>`;
                });
                stateSel.innerHTML += `<option value="Other">Other...</option>`;
            }
        });

        stateSel.addEventListener('change', () => {
            const country = countrySel.value;
            const state = stateSel.value;
            placeSel.innerHTML = '<option value="">-- Select Place --</option>';

            if (state === 'Other') {
                toggleCustom('customState', true);
                toggleCustom('customPlace', true);
                placeSel.disabled = false;
            } else if (locationDB[country] && locationDB[country][state]) {
                toggleCustom('customState', false);
                placeSel.disabled = false;
                locationDB[country][state].forEach(pl => {
                    placeSel.innerHTML += `<option value="${pl}">${pl}</option>`;
                });
                placeSel.innerHTML += `<option value="Other">Other...</option>`;
            }
        });

        placeSel.addEventListener('change', () => {
            if (placeSel.value === 'Other') {
                toggleCustom('customPlace', true);
            } else {
                toggleCustom('customPlace', false);
            }
        });

        function toggleCustom(id, show) {
            const el = document.getElementById(id);
            el.style.display = show ? 'block' : 'none';
            el.required = show;
        }

        // Render UI Elements
        function renderUI(filterCountry = "ALL") {
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Clear Markers
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            // 1. Populate Top Pivot Bar
            const pivotBar = document.getElementById('pivotBar');
            const uniqueCountries = [...new Set(entries.map(e => e.country))];
            
            let pivotHtml = `<span class="pivot-item ${filterCountry === 'ALL' ? 'active' : ''}" onclick="filterByCountry('ALL')">ALL</span>`;
            uniqueCountries.forEach(c => {
                const isActive = c === filterCountry ? 'active' : '';
                pivotHtml += `<span class="pivot-item ${isActive}" onclick="filterByCountry('${c}')">${c.toUpperCase()}</span>`;
            });
            pivotBar.innerHTML = pivotHtml;

            // Filter Entries
            const filtered = filterCountry === "ALL" 
                ? entries 
                : entries.filter(e => e.country === filterCountry);

            // 2. Render Blog Posts
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            filtered.forEach((entry, idx) => {
                const marker = L.marker([entry.lat, entry.lng]).addTo(map);
                marker.bindPopup(`<b>${entry.place}</b><br>${entry.state}, ${entry.country}`);
                mapMarkers.push(marker);

                const isFeatured = idx === 0;

                let photosHtml = '';
                if (entry.photos && entry.photos.length > 0) {
                    photosHtml = `<img src="${entry.photos[0]}" class="hero-photo" id="hero-${entry.id}">`;
                    if (entry.photos.length > 1) {
                        photosHtml += '<div class="thumbnail-grid">';
                        entry.photos.forEach(p => {
                            photosHtml += `<img src="${p}" onclick="document.getElementById('hero-${entry.id}').src='${p}'">`;
                        });
                        photosHtml += '</div>';
                    }
                }

                const postCard = `
                    <div class="post-card ${isFeatured ? 'featured' : ''}" id="post-${entry.id}">
                        ${isFeatured ? '<span class="post-badge">✨ Most Recent</span>' : ''}
                        <div class="post-title">${entry.place}</div>
                        <div class="post-sub">${entry.state}, ${entry.country} • ${entry.date}</div>
                        
                        ${entry.countryFacts ? `<div class="ai-facts-box"><strong>🌍 Country Info:</strong> ${entry.countryFacts}</div>` : ''}
                        ${entry.placeFacts ? `<div class="ai-facts-box"><strong>📍 Place Highlights:</strong> ${entry.placeFacts}</div>` : ''}

                        ${photosHtml}
                        <p class="post-story">${entry.story}</p>
                    </div>
                `;
                container.innerHTML += postCard;
            });

            if (filtered.length > 0) {
                map.flyTo([filtered[0].lat, filtered[0].lng], 6);
            }

            // 3. Render Tree View
            renderTreeView();

            // 4. Render Timeline
            renderTimeline(filtered);
        }

        function filterByCountry(c) {
            renderUI(c);
        }

        function renderTreeView() {
            const treeContainer = document.getElementById('treeContainer');
            let treeHtml = '<ul class="tree-list">';

            const countryMap = {};
            entries.forEach(e => {
                if (!countryMap[e.country]) countryMap[e.country] = {};
                if (!countryMap[e.country][e.state]) countryMap[e.country][e.state] = [];
                countryMap[e.country][e.state].push(e);
            });

            for (let c in countryMap) {
                treeHtml += `<li class="tree-node"><strong>▸ ${c}</strong><ul>`;
                for (let s in countryMap[c]) {
                    treeHtml += `<li class="tree-node">▸ ${s}<ul>`;
                    countryMap[c][s].forEach(p => {
                        treeHtml += `<li class="tree-node" onclick="scrollToAndClose('post-${p.id}')">• ${p.place}</li>`;
                    });
                    treeHtml += '</ul></li>';
                }
                treeHtml += '</ul></li>';
            }
            treeHtml += '</ul>';
            treeContainer.innerHTML = treeHtml;
        }

        function renderTimeline(filtered) {
            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';
            filtered.forEach(entry => {
                timelineList.innerHTML += `
                    <li class="timeline-item" onclick="scrollToAndClose('post-${entry.id}')">
                        <div class="t-place"><b>${entry.place}</b>, ${entry.country}</div>
                        <div class="t-date">${entry.date}</div>
                    </li>
                `;
            });
        }

        function scrollToAndClose(id) {
            closeSidebar();
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        // Gemini AI Integration
        document.getElementById('aiBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            const country = countrySel.value === 'Other' ? document.getElementById('customCountry').value : countrySel.value;
            const state = stateSel.value === 'Other' ? document.getElementById('customState').value : stateSel.value;
            const place = placeSel.value === 'Other' ? document.getElementById('customPlace').value : placeSel.value;
            const rawStory = document.getElementById('story').value;

            if (!apiKey) {
                alert("Please paste your Gemini API Key in the box above first!");
                return;
            }
            if (!place || !country) {
                alert("Please select or enter Country and Place first!");
                return;
            }

            const aiBtn = document.getElementById('aiBtn');
            aiBtn.innerText = "⏳ Gemini is thinking...";
            aiBtn.disabled = true;

            const prompt = `You are a travel assistant. Generate travel details in valid JSON format for location: Place: ${place}, State: ${state}, Country: ${country}.
            User Notes: "${rawStory}".
            Respond ONLY with a raw JSON object matching this schema:
            {
                "countryFacts": "1-2 lines on currency, primary language, and location.",
                "placeFacts": "4-5 lines about place speciality and must-sees.",
                "polishedStory": "Rephrase and polish the user notes into an enjoyable travel story composition."
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const jsonResult = JSON.parse(rawText);

                document.getElementById('story').value = jsonResult.polishedStory;
                window.lastAiResult = jsonResult; // Store generated facts temporarily
                alert("✨ Story polished and facts generated!");

            } catch (err) {
                console.error(err);
                alert("Failed to connect to Gemini API. Check your API key or network.");
            } finally {
                aiBtn.innerText = "✨ Polish & Generate with AI";
                aiBtn.disabled = false;
            }
        });

        // Photo File Converter
        function readFiles(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }));
        }

        // Geocoding Helper
        async function fetchCoordinates(place, state, country) {
            const query = `${place}, ${state}, ${country}`;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
            } catch (err) {}
            return { lat: 48.8912, lng: 11.1839 };
        }

        // Submit Form
        document.getElementById('travelForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Publishing...";
            btn.disabled = true;

            const finalCountry = countrySel.value === 'Other' ? document.getElementById('customCountry').value : countrySel.value;
            const finalState = stateSel.value === 'Other' ? document.getElementById('customState').value : stateSel.value;
            const finalPlace = placeSel.value === 'Other' ? document.getElementById('customPlace').value : placeSel.value;

            const photoFiles = document.getElementById('photoInput').files;
            let photoUrls = [];
            if (photoFiles.length > 0) photoUrls = await readFiles(photoFiles);

            const coords = await fetchCoordinates(finalPlace, finalState, finalCountry);

            const newEntry = {
                id: Date.now(),
                country: finalCountry,
                state: finalState,
                place: finalPlace,
                date: document.getElementById('visitDate').value,
                lat: coords.lat,
                lng: coords.lng,
                story: document.getElementById('story').value,
                countryFacts: window.lastAiResult ? window.lastAiResult.countryFacts : '',
                placeFacts: window.lastAiResult ? window.lastAiResult.placeFacts : '',
                photos: photoUrls
            };

            entries.unshift(newEntry);
            window.lastAiResult = null; // reset AI cache

            renderUI();
            document.getElementById('travelForm').reset();
            closeSidebar();

            btn.innerText = "Publish Memory";
            btn.disabled = false;
        });

        // Initial Render
        renderUI();
    </script>
</body>
</html>
